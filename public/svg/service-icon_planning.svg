    stroke: #3007ad;
    stroke-width: 1;
    fill: #3007ad;
    fill-opacity: 0;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: 
      drawIn 5s ease-out forwards,
      fadeIn 2s ease-out forwards,
      highlight 2s ease-out forwards;
  }
</style>
