<style>
  @keyframes drawIn {
    0% { stroke-dashoffset: 1000; }
    90% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    0%, 90% { fill-opacity: 0; }
    100% { fill-opacity: 1; }
  }
  @keyframes highlight {
    0%, 90% { stroke: #3007ad; }
    95% { stroke: #3007ad; }
    100% { stroke: #3007ad; }
  }
  #evaluation-icon {
    stroke: #3007ad;
    stroke-width: 1;
    fill: #3007ad;
    fill-opacity: 0;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: 
      drawIn 5s ease-out forwards,
      fadeIn 2s ease-out forwards,
      highlight 2s ease-out forwards;
  }
</style>
